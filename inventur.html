<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventurerfassung</title>

    <link rel="stylesheet" href="./TempoScan.css">
    
    <script src="./TempoScanI.js" defer></script>
    <script src="./main.js" defer></script>
</head>
<body>

    <div class="header-logo">
        <a href="http://192.168.240.3/">
            <img src="./img/LogoT.png" alt="Tempo Luft- und Wassertechnik GmbH" class="LogoCenter">
        </a>
    </div>

    <h1>Artikel für Inventur scannen:</h1>
    
    <div id="video-wrapper" class="Vid">
        <video id="video" poster="./img/Barcode.png" autoplay playsinline></video>
        <canvas id="canvas" class="divCanvas"></canvas>
    </div>

    <!-- Formular Scanneransicht -->
    <form>
        <table class="table-fullwidth">
            <tbody>
                <tr>
                    <td><label for="ArtNr">Artikel Nr:</label></td>
                    <td class="fontTempoBlackBold">
                        <input id="ArtNr" type="number" oninput="getArtDaten()">
                    </td>
                </tr>
                <tr>
                    <td>Einheit:</td>
                    <td id="ArtDatEinh" class="fontTempoBlackBold"></td>
                </tr>
                <tr>
                    <td>Bezeichnung:</td>
                    <td id="ArtDatBez" class="fontTempoBlackBold"></td>
                </tr>
                <tr>
                    <td>Größe:</td>
                    <td id="ArtDatGr" class="fontTempoBlackBold"></td>
                </tr>
                <tr>
                    <td><label for="Menge">Menge:</label></td>
                    <td class="fontTempoBlackBold">
                        <input id="Menge" type="number" min="1">
                    </td>
                </tr>
            </tbody>
        </table>

        <div id="idAuslauf" style="display:none">
            <p class="fontTempoRedBold">Achtung Auslaufartikel!</p>
        </div>

        <div class="button-group">
            <button type="button" id="scannen" class="styled">weiter scannen</button>
            <button type="button" id="mehr" class="styled">Artikel hinzufügen</button>
            <button type="button" id="senden" class="styled">senden</button>
        </div>
    </form>

    <h2>Gescannte Artikel:</h2>
    <p>Klicken Sie auf die Einträge, um sie zu entfernen.</p>
    
    <table id="BestellListe"> 
        <thead>
            <tr>
                <th>entf</th>
                <th>ArtikelNr</th>
                <th>Menge</th>
                <th>Einh</th>
                <th>Bezeichnung</th>
                <th>Größe</th>
            </tr>
        </thead>
        <tbody id="eintraege">
            <!-- Dynamische Zeilen via JS -->
        </tbody>
    </table>

    <button type="button" id="loeschen" class="styled">alle Einträge löschen</button>
    
    <div class="footer-info">
        <p>V2.261105 Inventur</p>   
    </div>

</body>
</html>
