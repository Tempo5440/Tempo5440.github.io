<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materialbestellungen</title>

    <link rel="stylesheet" href="./TempoScan.css">
    <!-- jQuery entfernt, da nativer moderner JS-Code genutzt wird -->
    <script src="./TempoScan.js" defer></script>
    <script src="./main.js" async></script>
</head>
<body>

    <a href="http://192.168.240.3/">
        <img src="./img/LogoT.png" alt="Tempo Luft- und Wassertechnik GmbH" class="LogoCenter">
    </a>

    <h1>Artikel für Bestellung scannen:</h1>
    
    <div id="video-wrapper" class="Vid">
        <!-- playsinline und muted sind zwingend erforderlich für iOS/Safari-Geräte -->
        <video id="video" poster="./img/Barcode.png" autoplay></video>
        <canvas id="canvas" class="divCanvas"></canvas>
    </div>

    <!-- action="javascript:void(0);" verhindert das Neuladen der Seite bei Klicks/Enter -->
    <form>
        <table style="width: 100%;">
            <colgroup>
                <col style="width: 30%;">
                <col style="width: 70%;">
            </colgroup>
            <tbody>
                <tr>
                    <td><label for="ArtNr">Artikel Nr:</label></td>
                    <td class="fontTempoBlackBold">
                        <input id="ArtNr" value="" type="number">
                    </td>
                </tr>
                <tr>
                    <td>Einheit:</td>
                    <td id="ArtDatEinh" class="fontTempoBlackBold">-</td>
                </tr>
                <tr>
                    <td>Bezeichnung:</td>
                    <td id="ArtDatBez" class="fontTempoBlackBold">Kein Artikel gescannt</td>
                </tr>
                <tr>
                    <td>Größe:</td>
                    <td id="ArtDatGr" class="fontTempoBlackBold">-</td>
                </tr>
                <tr>
                    <td>Bestellmenge:</td>
                    <td class="fontTempoBlackBold">
                        <input id="Menge" value="" type="number">
                    </td>
                </tr>
            </tbody>
        </table>

        <div id="idAuslauf" style="display:none">
            <p class="fontTempoRedBold">Achtung Auslaufartikel nicht bestellen!</p>
        </div>

        <!-- type="button" verhindert, dass Buttons das Formular ungewollt absenden -->
        <button type="button" id="scannen" class="styled">weiter scannen</button>
        <button type="button" id="mehr" class="styled">Artikel hinzufügen</button>
        <button type="button" id="senden" class="styled">senden</button>
    </form>

    <br>
    <h2>Gescannte Artikel:</h2>
    <p>Klicken Sie auf die Einträge, um sie zu entfernen.</p>
    <br>
    
    <table id="BestellListe"> 
        <thead>
            <tr>
                <th>entf</th>
                <th>ArtikelNr</th>
                <th>Menge</th>
                <th>Einh</th>
                <th>Bezeichnung</th>
                <th>Größe</th>
            </tr>
        </thead>
        <tbody id="eintraege">
            <!-- Dynamischer Inhalt durch JS -->
        </tbody>
    </table>

    <button type="button" id="loeschen" class="styled">alle Einträge löschen</button>
    <br><br>
    <p>V1.260904 TEST</p>   
    <br>
    <button type="button" id="invent" class="styled">zu Inventur wechseln</button>

    <!-- OPTIMIERT: Kompakte Artikelstammdaten mit data-Attributen -->
    <div hidden aria-hidden="true">
        <h2>Artikelstammdaten:</h2>
        <table id="stammdatenTabelle">
            <tbody>
                <!-- IDs liegen nur noch auf den Zeilen (tr). Inhalte wandern in data-Attribute -->
                <tr id="Row10101" data-einh="Stk" data-bez="T10-Haubenkörper" data-gr="" data-bestm="0" data-ausl="Wahr"></tr>
                <tr id="Row10102" data-einh="Stk" data-bez="T10-Kondensatteil" data-gr="" data-bestm="0" data-ausl="Wahr"></tr>
                <tr id="Row10103" data-einh="Stk" data-bez="T10-Abscheideteil" data-gr="" data-bestm="0" data-ausl="Wahr"></tr>
                <tr id="Row10104" data-einh="Stk" data-bez="T10-Umlenkteil" data-gr="" data-bestm="0" data-ausl="Wahr"></tr>
                <!-- Hier folgen die restlichen ~1000 kompakten Zeilen -->
            </tbody>
        </table>
    </div>   

</body>
</html>
